<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>NEXUS hologram</title>
  <style>
    :root {
      --bg:#0a0c0e; --phos:#7cff6b; --amber:#ffb000; --dim:#3d5244;
      --bezel:#12161a; --line:#1c2820; --down:#ff5a4a;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--bg); color:var(--phos); }
    body {
      font:13px/1.4 ui-monospace, "IBM Plex Mono", Menlo, monospace;
      min-height:100dvh; overflow-x:hidden;
    }
    .rack {
      max-width:420px; margin:0 auto; padding:12px 12px 28px;
      border:1px solid var(--line); min-height:100dvh;
    }
    .plate {
      display:flex; justify-content:space-between; align-items:baseline;
      letter-spacing:.18em; text-transform:uppercase; font-size:11px;
      color:var(--amber); margin-bottom:10px;
    }
    .plate span { letter-spacing:.08em; color:var(--dim); font-size:10px; }
    .crt {
      position:relative; background:#030504; border:10px solid var(--bezel);
      border-radius:6px; box-shadow:inset 0 0 40px rgba(124,255,107,.08);
    }
    canvas { display:block; width:100%; height:220px; }
    .caption {
      margin:8px 0 0; color:var(--dim); font-size:11px; letter-spacing:.04em;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .bank {
      display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:12px;
    }
    button {
      min-height:44px; min-width:44px; padding:0 6px;
      border:1px solid var(--line); background:#111418; color:var(--phos);
      font:11px/1 ui-monospace, Menlo, monospace; letter-spacing:.08em;
      cursor:pointer; text-transform:uppercase;
    }
    button.on { background:var(--phos); color:#0a0c0e; border-color:var(--phos); }
    button.amber { color:var(--amber); border-color:#3a2e12; }
    button.amber.on { background:var(--amber); color:#0a0c0e; border-color:var(--amber); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
    .lamp-row { margin-top:12px; }
    .lamp { display:flex; align-items:center; gap:8px; min-height:28px; color:var(--dim); font-size:11px; letter-spacing:.12em; }
    .dot { width:8px; height:8px; border-radius:99px; background:var(--phos); box-shadow:0 0 8px var(--phos); flex:0 0 auto; }
    .dot.down { background:var(--down); box-shadow:0 0 8px var(--down); }
    .read { color:var(--phos); font-size:12px; }
    .read .k { color:var(--dim); }
    a { color:var(--amber); }
    .foot { margin-top:16px; color:var(--dim); font-size:11px; }
  </style>
</head>
<body>
  <div class="rack">
    <div class="plate">NEXUS MK-II <span>hologram · not npm</span></div>
    <div class="crt">
      <canvas id="crt" width="720" height="220" aria-label="Analog phosphor CRT"></canvas>
    </div>
    <p class="caption" id="vec">Analog computer · LRNZ · OP</p>
    <div class="bank" id="progs" role="tablist" aria-label="Analog programs"></div>
    <div class="row">
      <button type="button" id="step" class="amber">Integrate</button>
      <button type="button" id="ic">IC reseed</button>
    </div>
    <div class="row" style="margin-top:12px">
      <div>
        <div class="read"><span class="k">Λ</span> <span id="lam">—</span></div>
        <div class="read"><span class="k">OURO</span> <span id="tax">—</span></div>
        <div class="read"><span class="k">ENERGY</span> UNAVAILABLE</div>
      </div>
      <div id="organs" class="lamp-row"></div>
    </div>
    <p class="foot">Six programs. Optical analog. NEMO is analog math, not silicon. Kernel organs UNAVAILABLE on the hologram. Λ uniqueness is Conjecture 1. Source: <a href="https://github.com/szl-holdings/nexus">szl-holdings/nexus</a></p>
  </div>
  <script>
    const PROGRAMS = [
      { id:"lorenz", label:"LRNZ" },
      { id:"harmonic", label:"HARM" },
      { id:"vanderpol", label:"VDP" },
      { id:"duffing", label:"DFFG" },
      { id:"lotka", label:"LTKA" },
      { id:"nemo", label:"NEMO" },
    ];
    const canvas = document.getElementById("crt");
    const ctx = canvas.getContext("2d");
    const state = { program:"lorenz", last:null, bank:null, t:0 };
    const bankEl = document.getElementById("progs");
    PROGRAMS.forEach((p) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = p.label;
      b.dataset.id = p.id;
      b.setAttribute("aria-pressed", p.id === state.program ? "true" : "false");
      if (p.id === state.program) b.classList.add("on");
      b.onclick = () => {
        state.program = p.id;
        state.last = null;
        state.bank = null;
        state.t = 0;
        [...bankEl.children].forEach((el) => {
          el.classList.toggle("on", el.dataset.id === p.id);
          el.setAttribute("aria-pressed", el.dataset.id === p.id ? "true" : "false");
        });
        tick();
      };
      bankEl.appendChild(b);
    });
    async function post(path, body) {
      const r = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{}) });
      return r.json();
    }
    function draw(j) {
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "rgba(3,5,4,0.42)";
      ctx.fillRect(0,0,w,h);
      const field = j.field || [];
      const rows = field.length || 1;
      const cols = (field[0]||[]).length || 1;
      const cw = w / cols, rh = h / rows;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const I = Math.min(1, (field[r][c] || 0) / 2.4);
          if (I < 0.08) continue;
          ctx.fillStyle = `rgba(124,255,107,${0.06 + I * 0.22})`;
          ctx.fillRect(c * cw, r * rh, cw, rh);
        }
      }
      const trail = j.trail || [];
      ctx.strokeStyle = "#7cff6b";
      ctx.lineWidth = 1.35;
      ctx.beginPath();
      trail.forEach((p, i) => {
        const x = w * 0.5 + p[0] * (j.program === "lorenz" ? 10 : 48);
        const y = h * 0.52 + (p[1] - (j.program === "lorenz" ? p[2] * 0.35 : 0)) * (j.program === "lorenz" ? 4.2 : 28);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      if (trail.length) {
        const p = trail[trail.length - 1];
        const x = w * 0.5 + p[0] * (j.program === "lorenz" ? 10 : 48);
        const y = h * 0.52 + (p[1] - (j.program === "lorenz" ? p[2] * 0.35 : 0)) * (j.program === "lorenz" ? 4.2 : 28);
        ctx.fillStyle = "#ffb000";
        ctx.beginPath();
        ctx.arc(x, y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    async function tick(reseed) {
      const body = {
        program: state.program,
        steps: state.program === "nemo" ? 120 : 480,
        chaos: 0.45,
        drive: 0.7,
      };
      if (!reseed && state.last) {
        body.x = state.last[0];
        body.y = state.last[1];
        body.z = state.last[2];
        body.t = state.t;
        if (state.bank) body.bank = state.bank;
      }
      const j = await post("/api/analog", body);
      draw(j);
      state.last = j.last;
      state.bank = j.bank || null;
      state.t = j.t || 0;
      const last = (j.last || [0,0,0]).map((n) => Number(n).toFixed(2)).join("  ");
      const pots = (j.pots && j.pots.label) || "";
      document.getElementById("vec").textContent =
        `Analog computer · ${j.label || "LRNZ"} · OP · ${pots} · ${last}`;
      const lam = await post("/api/lambda", { axes: [0.97,0.96,0.93,0.91,0.9,0.92,0.88,0.91,0.9,0.94,0.9,0.89,0.91] });
      document.getElementById("lam").textContent = (lam.lambda||0).toFixed(4) + " " + (lam.decision||"");
      const org = await post("/api/organs", {});
      document.getElementById("organs").innerHTML = Object.entries(org.organs||{}).map(([k,v]) =>
        `<div class="lamp"><span class="dot ${v?"":"down"}"></span>${k} ${v?"LIVE":"UNAVAILABLE"}</div>`
      ).join("");
      const tax = await post("/api/ouroboros", { amplitude: 1, bars: 8 });
      document.getElementById("tax").textContent = Number(tax.tax).toFixed(4);
    }
    document.getElementById("step").onclick = () => tick(false);
    document.getElementById("ic").onclick = () => tick(true);
    tick(true);
  </script>
</body>
</html>
