version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      github_actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # TypeScript is held on 6.0.x until typescript-eslint's peer range admits
      # a newer line. Every typescript-eslint release through 8.71.2 (and canary
      # 8.71.3-alpha.3) declares peer typescript ">=4.8.4 <6.1.0", so a 6.1+/7.x
      # bump makes `npm ci` fail with ERESOLVE (see PR #61). Remove this entry
      # once a typescript-eslint release widens that range.
      - dependency-name: "typescript"
        versions: [">=6.1"]

  # "/space" holds space/Dockerfile, the image the canonical Space runs; "/" holds
  # the leftover dev image. The CI space job builds and smoke-tests every change
  # to space/Dockerfile.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/space"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # space/Dockerfile builds on node:26 and runs python:3.12; the source
      # contract (scripts/nexus-space-contract.test.mjs) asserts both lines, and
      # AGENTS.md makes a runtime-line change a separately qualified migration.
      # Digest and patch refreshes of those tags still arrive. "library/node" is
      # the root Dockerfile's mirror.gcr.io name for the same image.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "library/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
