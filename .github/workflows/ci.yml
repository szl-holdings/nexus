name: CI

# Source quality gate for every pull request and every push to main. There is
# deliberately no path filter: a gate that skips a change says nothing about it.
# This is source CI only. It does not publish, deploy or read back a runtime;
# per AGENTS.md those are distinct gates (see hf-deploy.yml and IMMUNE).
on:
  push:
    branches: [main]
  pull_request:
  merge_group: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} (typecheck, lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22: the Docker image line (Dockerfile, @types/node ^22). 24: current LTS.
        node: ["22", "24"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Block high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # scripts/run-tests.mjs discovers every *.test.{mjs,ts} under scripts/
      # and src/, fails on any failing test, and fails if src/lib/nexus/ runs
      # fewer passing tests than its floor. Quarantined scaffold tests are
      # listed by name and reason at the end of the output.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  python:
    name: Python (compile, selftest, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile every tracked Python file
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
          echo "compiled: $(git ls-files -- '*.py' | tr '\n' ' ')"

      - name: Hologram server selftest
        run: python server.py --selftest

      - name: Source-bound wrapper selftest
        run: python source_bound_server.py --selftest

      - name: pytest
        shell: bash
        run: |
          set -euo pipefail
          tests="$(git ls-files | grep -E '(^|/)(test_[^/]*|[^/]*_test)\.py$' || true)"
          if [ -z "$tests" ]; then
            echo "::notice title=pytest::no pytest files (test_*.py, *_test.py) are tracked; nothing to run"
            exit 0
          fi
          printf 'pytest files:\n%s\n' "$tests"
          if [ -f python/requirements-dev.txt ]; then
            # Pinned test-only deps for python/tests (pytest + hypothesis); nexus_dynamics itself is stdlib only.
            python -m pip install --disable-pip-version-check -r python/requirements-dev.txt
          else
            python -m pip install --disable-pip-version-check 'pytest==9.1.1'
          fi
          python -m pytest -q
  space:
    name: Space container (exact source, non-root, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          printf '%s' "$SOURCE_REVISION" > SOURCE_GITHUB_SHA

      - name: Build exact Space closure
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --tag "szl-nexus:${SOURCE_REVISION}" --file space/Dockerfile .

      - name: Run and verify source-bound Space
        shell: bash
        run: |
          set -euo pipefail
          name="szl-nexus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "NEXUS_CONTAINER=$name" >> "$GITHUB_ENV"
          docker run --detach --name "$name" --publish 127.0.0.1:7860:7860 "szl-nexus:${SOURCE_REVISION}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:7860/healthz > /tmp/nexus-health.json; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$name"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:7860/ > /tmp/nexus-root.html
          curl --fail --silent --show-error http://127.0.0.1:7860/api/build-info > /tmp/nexus-build.json
          python -I -P - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["SOURCE_REVISION"]
          health = json.loads(Path("/tmp/nexus-health.json").read_text(encoding="utf-8"))
          build = json.loads(Path("/tmp/nexus-build.json").read_text(encoding="utf-8"))
          root = Path("/tmp/nexus-root.html").read_text(encoding="utf-8")
          assert health["ready"] is True and health["source_revision"] == expected, health
          assert build["source_bound"] is True and build["source_revision"] == expected, build
          assert build["runtime"] == "NITRO_NODE_WEB_AUDIO", build
          assert "NEXUS MK-II" in root, root[:500]
          PY
          test "$(docker inspect --format '{{.Config.User}}' "$name")" = node
          test "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy

      - name: Preserve container logs on failure
        if: failure()
        shell: bash
        run: docker logs "$NEXUS_CONTAINER" || true

      - name: Remove test container
        if: always()
        shell: bash
        run: |
          if [ -n "${NEXUS_CONTAINER:-}" ]; then
            docker rm -f "$NEXUS_CONTAINER" >/dev/null 2>&1 || true
          fi
