name: Deploy to HuggingFace Space

# Canonical Space publisher is szl-holdings/yarqa `.github/workflows/deploy-nexus.yml`.
# That repo holds HF_ORG_TOKEN. This caller does not. Do not fail-loud on a token
# that is not bound here — that painted every merge red while the instrument
# was already live. Skip honestly.
#
# If this repo is later granted the token, still refuse the root Dockerfile.
# That image is leftover vite-dev + npm ci. The HF factory BUILD_ERRORs on
# npm ci (~3s cache-miss dump). Yarqa prebuilds the Nitro node-server bundle
# and publishes space/Dockerfile. GitHub remains source of truth.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Publisher binding
    runs-on: ubuntu-latest
    outputs:
      bound: ${{ steps.s.outputs.bound }}
    steps:
      - id: s
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${HF_TOKEN:-}" ]; then
            echo "bound=true" >> "$GITHUB_OUTPUT"
            echo "Token is bound, but this repo must not publish the root Dockerfile."
            echo "Canonical Space publisher: szl-holdings/yarqa deploy-nexus.yml"
            echo "(prebuild + space/Dockerfile). Refusing the vite-dev image."
          else
            echo "bound=false" >> "$GITHUB_OUTPUT"
            echo "HF_ORG_TOKEN unbound on szl-holdings/nexus."
            echo "Canonical Space publisher: szl-holdings/yarqa deploy-nexus.yml."
            echo "GitHub remains source of truth. This is not a failed deploy."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.bound == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse leftover vite-dev image
        run: |
          set -euo pipefail
          echo "HF token is bound on szl-holdings/nexus."
          echo "This workflow will not call reusable-hf-deploy against Dockerfile."
          echo "That image is leftover vite-dev (npm ci). Space image is space/Dockerfile."
          echo "Canonical publisher: szl-holdings/yarqa deploy-nexus.yml."
          echo "GitHub remains source. This is not a failed deploy."
