name: Hugging Face publication pipeline

# Pull requests run protected, no-secret workflow validation only. A push to main
# or an explicit dispatch performs the real publication and cannot report green
# unless the exact Hub commit, deployed bytes, runtime state, and smoke route
# are attested by the protected reusable publisher.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-deploy.yml
      - .dockerignore
      - space/Dockerfile
      - space/Dockerfile.dockerignore
      - server.py
      - index.html
      - requirements.txt
      - README.md
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hf-deploy.yml
      - .dockerignore
      - space/Dockerfile
      - space/Dockerfile.dockerignore
      - server.py
      - index.html
      - requirements.txt
      - README.md
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: hf-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate publisher caller (no provider write)
    if: github.event_name == 'pull_request'
    uses: szl-holdings/.github/.github/workflows/reusable-workflow-lint.yml@c889276e51e7d954c4bba8b216f86fc7577721fa
    with:
      fail-on-zizmor-warning: false

  deploy:
    name: Publish exact source and attest live state
    if: github.event_name != 'pull_request'
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@c889276e51e7d954c4bba8b216f86fc7577721fa
    with:
      hf-repo: SZLHOLDINGS/nexus
      ref: ${{ github.sha }}
      dockerfile-path: space/Dockerfile
      include-readme: true
      prune: true
      require-default-branch-tip: true
      restart-space: true
      wait-running: 1200
      smoke-paths: '["/"]'
    secrets:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
