name: Hugging Face publication ownership

# Provider writes for SZLHOLDINGS/nexus are centrally owned by
# szl-holdings/.github/.github/workflows/publish-nexus-space.yml. This source
# repository keeps only a no-secret ownership/provenance guard so a caller-local
# token scope can never create a permanent false-red deployment lane again.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-publication-ownership-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Prove central publication ownership and local source binding
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate delegation and source-bound runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile server.py source_bound_server.py
          python server.py --selftest
          python source_bound_server.py --selftest
          node --experimental-strip-types --test src/lib/nexus/source-identity.test.ts scripts/nexus-space-contract.test.mjs
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/hf-deploy.yml').read_text(encoding='utf-8')
          dockerfile = Path('space/Dockerfile').read_text(encoding='utf-8')
          wrapper = Path('source_bound_server.py').read_text(encoding='utf-8')
          runtime = Path('server/middleware/nexus-runtime.ts').read_text(encoding='utf-8')
          identity = Path('src/lib/nexus/source-identity.ts').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          agents = Path('AGENTS.md').read_text(encoding='utf-8')
          forbidden = (
              'secrets.' + 'HF_',
              'reusable-hf-' + 'deploy.yml',
              'upload_' + 'file(',
              'create_' + 'repo(',
              'restart_' + 'space(',
          )
          for fragment in forbidden:
              if fragment in workflow:
                  raise SystemExit(f'local provider writer reintroduced: {fragment}')
          required = (
              'publish-nexus-space.yml',
              'COPY --chown=node:node SOURCE_GITHUB_SHA /app/SOURCE_GITHUB_SHA',
              'CMD ["node", ".output/server/index.mjs"]',
              'NITRO_NODE_WEB_AUDIO',
              'path === "/api/build-info"',
              'source_revision: sourceRevision',
          )
          combined = workflow + '\n' + dockerfile + '\n' + wrapper + '\n' + runtime + '\n' + identity
          missing = [fragment for fragment in required if fragment not in combined]
          if missing:
              raise SystemExit(f'missing Nexus publication/source controls: {missing!r}')

          readme_required = (
              'Canonical organization Space target:',
              'Origin preview:',
              'IMMUNE verification plane:',
              'not a fourth commercial flagship',
          )
          missing_readme = [fragment for fragment in readme_required if fragment not in readme]
          if missing_readme:
              raise SystemExit(f'missing Nexus README authority boundary: {missing_readme!r}')
          if '- Space: [SZLHOLDINGS/nexus]' in readme:
              raise SystemExit('README must not present the provider projection as the public Space')

          agents_required = (
              'Canonical interactive runtime target: `SZLHOLDINGS/nexus`',
              'Personal origin preview: `betterwithage/nexus`',
              'Do not publish directly to Hugging Face from this repository',
              'Source CI, provider publication, live runtime readback, browser acceptance, and proof/evaluation publication are distinct gates.',
          )
          missing_agents = [fragment for fragment in agents_required if fragment not in agents]
          if missing_agents:
              raise SystemExit(f'missing Nexus agent authority boundary: {missing_agents!r}')
          if '/workspace/startup.sh' in agents or 'XAI_API_KEY' in agents:
              raise SystemExit('generic App Builder execution contract reintroduced into Nexus AGENTS.md')

          uses = re.findall(r'^\s*uses:\s*(\S+)\s*(?:#.*)?$', workflow, re.MULTILINE)
          bad = [value for value in uses if not re.fullmatch(r'[^@\s]+@[0-9a-f]{40}', value)]
          if bad:
              raise SystemExit(f'unpinned actions: {bad!r}')
          print('Nexus central-publication ownership and authority boundary: PASS')
          PY
          git diff --check
