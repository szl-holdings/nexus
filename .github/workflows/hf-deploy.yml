name: Deploy to HuggingFace Space

# Canonical Space publisher is szl-holdings/yarqa `.github/workflows/deploy-nexus.yml`.
# That repo holds HF_ORG_TOKEN. This caller does not. Do not fail-loud on a token
# that is not bound here — that painted every merge red while the instrument
# was already live. Skip honestly. If this repo is later granted the token,
# the reusable deployer runs.
#
# Yarqa builds the Nitro node-server bundle and publishes space/Dockerfile.
# The root Dockerfile (vite dev) is not the Space image.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Publisher binding
    runs-on: ubuntu-latest
    outputs:
      bound: ${{ steps.s.outputs.bound }}
    steps:
      - id: s
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${HF_TOKEN:-}" ]; then
            echo "bound=true" >> "$GITHUB_OUTPUT"
          else
            echo "bound=false" >> "$GITHUB_OUTPUT"
            echo "HF_ORG_TOKEN unbound on szl-holdings/nexus."
            echo "Canonical Space publisher: szl-holdings/yarqa deploy-nexus.yml."
            echo "GitHub remains source of truth. This is not a failed deploy."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.bound == 'true'
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@e3ec47ad2e99a535839afe0f30fefbd8973d52da
    with:
      hf-repo: SZLHOLDINGS/nexus
      ref: ${{ github.sha }}
      dockerfile-path: Dockerfile
      include-readme: true
      prune: true
      wait-running: 900
      restart-space: true
      require-default-branch-tip: true
      smoke-paths: '["/"]'
    secrets:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
